name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce lowercase brand
        run: |
          legacy_brand='IN''CLD'
          if git grep -n -I -E "(^|[^[:alnum:]_])${legacy_brand}([^[:alnum:]_]|$)"; then
            echo "Use incld, @incld, or incld.dev in public-facing text."
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
